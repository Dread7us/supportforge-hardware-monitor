[platformio]
default_envs = m5stack-coreink

[env:m5stack-coreink]
platform = espressif32@6.10.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    m5stack/M5Core-Ink @ ^0.0.7
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
build_unflags =
    -std=gnu++11